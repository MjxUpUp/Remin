name: constitution
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  constitution:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build & Vet
        run: go build ./... && go vet ./...
      - name: Tests (with race)
        run: go test -race ./...
      - name: Constitution gate（宪法五套件 + 依赖扫描 + 适配器预算）
        run: make constitution
